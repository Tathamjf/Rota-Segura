<!DOCTYPE html>

<html lang="pt-br">

<head>

    <title>Rota Segura | Notificar Ausência</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="notificarfalta.css">

</head>

<body text="white">

    <div class="titulo">
    <h1>Notificar Ausência</h1>
   </div>

    <form>

        <div class="formulario">
        <p><label>Nome do Dependente</label></p>
        <p><input type="text" placeholder="Insira o nome do dependente" width="65" height="10"></p>
        </div>
        
        
        <div class="formulario">
        <p><label>Data da Ausência</label></p>
        <p><input type="date" placeholder="dd-mm-aaaa" width="30" height="10"</p>
        </div>
        

        <div class="formulario">
        <p><label>Motivo</label></p>
        <p><input type="text" placeholder="Insira o motivo da ausência (opcional)" width="65" height="10"></p>
        </div>
        
        

        <div class="formulario">
        <p><label>Tipo</label></p>
        <select>
        <option>Problemas de saúde</option>
        <option>Compromissos</option>
        <option>Outros</option>
        </select>
        </div>
        

        <button type="submit" class="botao">Enviar</button>

    

    </form>

    <script>
document.querySelector("form").onsubmit = function() {
    alert("✅ Ausência notificada com sucesso!");
    this.reset();
    return false;
};


</script>


</body>







</html>
