<!DOCTYPE html>

<html>

<head>

<title>Rota Segura | Cadastro de Dependentes</title>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="cadastrodependente.css"

    
</head>

<body bgcolor="black" text="white">
    
   <div class="titulo">
    <h1>Cadastrar Dependente</h1>
   </div>

    <form>

        <div class="formulario">
        <p><label>Nome Completo</label></p>
        <p><input type="text" placeholder="Insira o nome completo" width="65" height="10"></p>
        </div>
        
        
        <div class="formulario">
        <p><label>Data de Nascimento</label></p>
        <p><input type="date" placeholder="dd-mm-aaaa" width="30" height="10"</p>
        </div>
        

        <div class="formulario">
        <p><label>Gênero</label></p>
        <select>
        <option>Feminino</option>
        <option>Masculino</option>
        </select>
        </div>
        

        <div class="formulario">
        <p><label>Escola</label></p>
        <p><input type="text" placeholder="Insira o nome da Escola" width="65" height="10"></p>
        </div>
        

        <div class="formulario">
        <p><label>Ano/Série</label></p>
        <input type="text" placeholder="Insira o ano Escolar" width="65" height="10">
        </div>
        

<div class="formulario">
        <p><label>Ponto de Embarque</label></p>
        <p><input type="text" placeholder="Insira o ponto de embarque" width="65" height="10"</p>
        </div>
        

        <div class="formulario">
        <p><label>Ponto de Desembarque</label></p>
        <p><input type="text" placeholder="Insira o ponto de desembarque" width="65" height="10"</p>
        </div>
        

        <div class="formulario">
        <p><label>Turno</label></p>
        <select>
        <option>Manhã</option>
        <option>Tarde</option>
        </select>
        </div>
        

        <button type="submit" class="botao">Cadastrar</button>

    

    </form>

    <script>
document.querySelector("form").onsubmit = function() {
    alert("✅ Dependente cadastrado com sucesso!");
    this.reset();
    return false;
};


</script>

</body>

</html>
